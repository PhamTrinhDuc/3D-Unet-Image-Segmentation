<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="800" height="600" fill="#f8f9fa" />
    
    <!-- Title -->
    <text x="400" y="30" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">Kiến trúc UNET3D</text>
    
    <!-- Encoder Path - Left side of U -->
    <!-- Block 1 -->
    <rect x="100" y="80" width="100" height="60" fill="#ffcccc" stroke="#ff0000" stroke-width="2" rx="5" />
    <text x="150" y="110" font-family="Arial" font-size="12" text-anchor="middle">Conv3D Block</text>
    <text x="150" y="125" font-family="Arial" font-size="10" text-anchor="middle">16 channels</text>
    
    <!-- Arrow down -->
    <line x1="150" y1="140" x2="150" y2="160" stroke="#000" stroke-width="2" />
    <polygon points="145,155 150,160 155,155" fill="#000" />
    
    <!-- Block 2 -->
    <rect x="100" y="160" width="100" height="60" fill="#ffcccc" stroke="#ff0000" stroke-width="2" rx="5" />
    <text x="150" y="185" font-family="Arial" font-size="12" text-anchor="middle">Conv3D Block</text>
    <text x="150" y="200" font-family="Arial" font-size="10" text-anchor="middle">32 channels</text>
    <text x="80" y="190" font-family="Arial" font-size="10" text-anchor="middle">MaxPool</text>
    
    <!-- Arrow down -->
    <line x1="150" y1="220" x2="150" y2="240" stroke="#000" stroke-width="2" />
    <polygon points="145,235 150,240 155,235" fill="#000" />
    
    <!-- Block 3 -->
    <rect x="100" y="240" width="100" height="60" fill="#ffcccc" stroke="#ff0000" stroke-width="2" rx="5" />
    <text x="150" y="265" font-family="Arial" font-size="12" text-anchor="middle">Conv3D Block</text>
    <text x="150" y="280" font-family="Arial" font-size="10" text-anchor="middle">64 channels</text>
    <text x="80" y="270" font-family="Arial" font-size="10" text-anchor="middle">MaxPool</text>
    
    <!-- Arrow down -->
    <line x1="150" y1="300" x2="150" y2="320" stroke="#000" stroke-width="2" />
    <polygon points="145,315 150,320 155,315" fill="#000" />
    
    <!-- Block 4 -->
    <rect x="100" y="320" width="100" height="60" fill="#ffcccc" stroke="#ff0000" stroke-width="2" rx="5" />
    <text x="150" y="345" font-family="Arial" font-size="12" text-anchor="middle">Conv3D Block</text>
    <text x="150" y="360" font-family="Arial" font-size="10" text-anchor="middle">128 channels</text>
    <text x="80" y="350" font-family="Arial" font-size="10" text-anchor="middle">MaxPool</text>
    
    <!-- Arrow down -->
    <line x1="150" y1="380" x2="150" y2="400" stroke="#000" stroke-width="2" />
    <polygon points="145,395 150,400 155,395" fill="#000" />
    
    <!-- Block 5 (Bottom of U) -->
    <rect x="100" y="400" width="120" height="80" fill="#ffcccc" stroke="#ff0000" stroke-width="2" rx="5" />
    <text x="160" y="435" font-family="Arial" font-size="14" text-anchor="middle">Conv3D Block</text>
    <text x="160" y="455" font-family="Arial" font-size="12" text-anchor="middle">256 channels</text>
    <text x="80" y="430" font-family="Arial" font-size="10" text-anchor="middle">MaxPool</text>
    
    <!-- Bottom of U connector -->
    <line x1="220" y1="440" x2="280" y2="440" stroke="#000" stroke-width="2" />
    <polygon points="275,435 280,440 275,445" fill="#000" />
    
    <!-- Bottom block (deepest) -->
    <rect x="280" y="400" width="140" height="80" fill="#ffeecc" stroke="#ff8800" stroke-width="2" rx="5" />
    <text x="350" y="435" font-family="Arial" font-size="14" text-anchor="middle">Conv3D Block</text>
    <text x="350" y="455" font-family="Arial" font-size="12" text-anchor="middle">512 channels</text>
    
    <!-- Right side of U (Decoder Path) -->
    <!-- Arrow up -->
    <line x1="550" y1="400" x2="550" y2="380" stroke="#000" stroke-width="2" />
    <polygon points="545,385 550,380 555,385" fill="#000" />
    
    <!-- Block 6 (Decoder) -->
    <rect x="500" y="400" width="100" height="80" fill="#ffddcc" stroke="#ff6600" stroke-width="2" rx="5" />
    <text x="550" y="435" font-family="Arial" font-size="12" text-anchor="middle">Conv3D Block</text>
    <text x="550" y="450" font-family="Arial" font-size="10" text-anchor="middle">256 channels</text>
    <text x="620" y="430" font-family="Arial" font-size="10" text-anchor="middle">ConvT</text>
    
    <!-- Bottom to decoder connection -->
    <line x1="420" y1="440" x2="500" y2="440" stroke="#000" stroke-width="2" />
    <polygon points="495,435 500,440 495,445" fill="#000" />
    
    <!-- Block 7 (Decoder) -->
    <rect x="500" y="320" width="100" height="60" fill="#ffddcc" stroke="#ff6600" stroke-width="2" rx="5" />
    <text x="550" y="345" font-family="Arial" font-size="12" text-anchor="middle">Conv3D Block</text>
    <text x="550" y="360" font-family="Arial" font-size="10" text-anchor="middle">128 channels</text>
    <text x="620" y="350" font-family="Arial" font-size="10" text-anchor="middle">ConvT</text>
    
    <!-- Skip connection 4 -->
    <line x1="200" y1="350" x2="500" y2="350" stroke="#000" stroke-width="2" stroke-dasharray="5,3" />
    <text x="350" y="340" font-family="Arial" font-size="10" text-anchor="middle">Skip Connection</text>
    
    <!-- Arrow up -->
    <line x1="550" y1="320" x2="550" y2="300" stroke="#000" stroke-width="2" />
    <polygon points="545,305 550,300 555,305" fill="#000" />
    
    <!-- Block 8 (Decoder) -->
    <rect x="500" y="240" width="100" height="60" fill="#ffddcc" stroke="#ff6600" stroke-width="2" rx="5" />
    <text x="550" y="265" font-family="Arial" font-size="12" text-anchor="middle">Conv3D Block</text>
    <text x="550" y="280" font-family="Arial" font-size="10" text-anchor="middle">64 channels</text>
    <text x="620" y="270" font-family="Arial" font-size="10" text-anchor="middle">ConvT</text>
    
    <!-- Skip connection 3 -->
    <line x1="200" y1="270" x2="500" y2="270" stroke="#000" stroke-width="2" stroke-dasharray="5,3" />
    <text x="350" y="260" font-family="Arial" font-size="10" text-anchor="middle">Skip Connection</text>
    
    <!-- Arrow up -->
    <line x1="550" y1="240" x2="550" y2="220" stroke="#000" stroke-width="2" />
    <polygon points="545,225 550,220 555,225" fill="#000" />
    
    <!-- Block 9 (Decoder) -->
    <rect x="500" y="160" width="100" height="60" fill="#ffddcc" stroke="#ff6600" stroke-width="2" rx="5" />
    <text x="550" y="185" font-family="Arial" font-size="12" text-anchor="middle">Conv3D Block</text>
    <text x="550" y="200" font-family="Arial" font-size="10" text-anchor="middle">32 channels</text>
    <text x="620" y="190" font-family="Arial" font-size="10" text-anchor="middle">ConvT</text>
    
    <!-- Skip connection 2 -->
    <line x1="200" y1="190" x2="500" y2="190" stroke="#000" stroke-width="2" stroke-dasharray="5,3" />
    <text x="350" y="180" font-family="Arial" font-size="10" text-anchor="middle">Skip Connection</text>
    
    <!-- Arrow up -->
    <line x1="550" y1="160" x2="550" y2="140" stroke="#000" stroke-width="2" />
    <polygon points="545,145 550,140 555,145" fill="#000" />
    
    <!-- Block 10 (Decoder - Top) -->
    <rect x="500" y="80" width="100" height="60" fill="#ffddcc" stroke="#ff6600" stroke-width="2" rx="5" />
    <text x="550" y="110" font-family="Arial" font-size="12" text-anchor="middle">Conv3D Block</text>
    <text x="550" y="125" font-family="Arial" font-size="10" text-anchor="middle">16 channels</text>
    <text x="620" y="110" font-family="Arial" font-size="10" text-anchor="middle">ConvT</text>
    
    <!-- Skip connection 1 -->
    <line x1="200" y1="110" x2="500" y2="110" stroke="#000" stroke-width="2" stroke-dasharray="5,3" />
    <text x="350" y="100" font-family="Arial" font-size="10" text-anchor="middle">Skip Connection</text>
    
    <!-- Output layer -->
    <rect x="600" y="80" width="100" height="60" fill="#ffffcc" stroke="#aaaa00" stroke-width="2" rx="5" />
    <text x="650" y="110" font-family="Arial" font-size="12" text-anchor="middle">Output Conv3D</text>
    <text x="650" y="125" font-family="Arial" font-size="10" text-anchor="middle">Segmentation Map</text>
    
    <!-- Arrow to output -->
    <!-- Cột 1 -->
    <rect x="150" y="510" width="20" height="15" fill="#ffcccc" stroke="#ff0000" stroke-width="1" />
    <text x="175" y="522" font-family="Arial" font-size="12" text-anchor="start">Encoder Block</text>

    <rect x="150" y="535" width="20" height="15" fill="#ffddcc" stroke="#ff6600" stroke-width="1" />
    <text x="175" y="547" font-family="Arial" font-size="12" text-anchor="start">Decoder Block</text>

    <!-- Cột 2 -->
    <rect x="300" y="510" width="20" height="15" fill="#ffeecc" stroke="#ff8800" stroke-width="1" />
    <text x="325" y="522" font-family="Arial" font-size="12" text-anchor="start">Bottom Block (512 channels)</text>

    <rect x="300" y="535" width="20" height="15" fill="#ffffcc" stroke="#aaaa00" stroke-width="1" />
    <text x="325" y="547" font-family="Arial" font-size="12" text-anchor="start">Output Layer</text>

    <!-- Cột 3 -->
    <rect x="500" y="510" width="20" height="15" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="5,3" />
    <text x="525" y="522" font-family="Arial" font-size="12" text-anchor="start">Skip Connection</text>
  
    <!-- U-shape highlight -->
    <path d="M 50,240 Q 150,460 350,460 Q 550,460 650,240" fill="none" stroke="#8888ff" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="10,5" />
  </svg>
</body>
</html>
